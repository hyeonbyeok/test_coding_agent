worker_processes auto;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # 로컬 테스트: 각 컴포넌트가 host 포트로 떠 있어 host.docker.internal 로 접근한다.
  # 운영에서는 이 자리가 각 VM 의 사설 IP다 (../네트워크 다이어그램.jpg 참고).
  upstream frontend_dev  { server host.docker.internal:5173; }
  upstream backend_tomcat { server host.docker.internal:8082; }
  upstream tiles_server   { server host.docker.internal:8081; }

  server {
    listen 80;

    # 3절: 타일은 Tomcat 을 거치지 않는다 — 요청 수가 많아 WAS 스레드풀을 잠식하기 때문
    location /tiles/ {
      proxy_pass http://tiles_server/;
      proxy_set_header Host $host;
    }

    # 3절 CVE 완화: /api 에는 필요한 메서드(GET/POST)만 통과시킨다
    location /api/ {
      limit_except GET POST { deny all; }
      proxy_pass http://backend_tomcat/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cookie_path / /;
    }

    # / → React 빌드 정적 파일 (dev: Vite, 플랜 3절 다이어그램)
    location / {
      proxy_pass http://frontend_dev;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
